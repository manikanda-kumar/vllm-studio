              - heading "architecture-diagram.md" [level=1] [ref=e430]
              - article [ref=e405]:
                - text: "# Clicky Architecture Diagram This document captures the current runtime architecture for Clicky as it exists in this repo today. It focuses on: - the macOS app's main runtime components - the optional Cloudflare Worker proxy - the external providers and system frameworks the app depends on - the end-to-end push-to-talk interaction loop ## Runtime Architecture ```mermaid flowchart LR user[User] subgraph macOS[macOS Device] subgraph app[Clicky App] appEntry[leanring_buddyApp.swift\\nCompanionAppDelegate] menuBar[MenuBarPanelManager\\nStatus item + floating panel] panelView[CompanionPanelView\\nSwiftUI controls] companionManager[CompanionManager\\nOrchestration state machine] shortcutMonitor[GlobalPushToTalkShortcutMonitor] dictationManager[BuddyDictationManager] transcriptionFactory[BuddyTranscriptionProvider] screenCapture[CompanionScreenCaptureUtility] groundingCoordinator[GroundingCoordinator] nativeAutomation[NativeMacOSAutomationProvider] overlayWindow[OverlayWindow\\nCursor + response overlay] chatProviders[Chat Providers\\nClaudeWorkerChatProvider\\nOpenAIChatProvider] ttsClients[Speech Output\\nElevenLabsTTSClient\\nSystemTTSClient] appConfig[AppBundleConfiguration] analytics[ClickyAnalytics] end subgraph system[macOS Frameworks and Permissions] avAudio[AVAudioEngine] screenCaptureKit[ScreenCaptureKit] accessibility[Accessibility APIs] speechFramework[Speech Framework] appKitSwiftUI[AppKit + SwiftUI] systemSpeech[System Speech Synthesizer] end end subgraph worker[Optional Cloudflare Worker] workerRoutes[worker/src/index.ts\\n/chat\\n/tts\\n/transcribe-token] end subgraph external[External Providers] openAI[OpenAI\\nchat + transcription + computer use] anthropic[Anthropic Claude] assemblyAI[AssemblyAI streaming] elevenLabs[ElevenLabs TTS] posthog[PostHog] end user --> menuBar menuBar --> panelView appEntry --> menuBar appEntry --> companionManager panelView --> companionManager shortcutMonitor --> companionManager companionManager --> dictationManager dictationManager --> transcriptionFactory dictationManager --> avAudio transcriptionFactory --> speechFramework companionManager --> screenCapture screenCapture --> screenCaptureKit companionManager --> chatProviders companionManager --> groundingCoordinator groundingCoordinator --> nativeAutomation nativeAutomation --> accessibility groundingCoordinator --> openAI groundingCoordinator --> overlayWindow companionManager --> ttsClients ttsClients --> systemSpeech companionManager --> overlayWindow overlayWindow --> appKitSwiftUI companionManager --> analytics analytics --> posthog appConfig --> companionManager appConfig --> dictationManager appConfig --> chatProviders appConfig --> ttsClients appConfig --> groundingCoordinator chatProviders --> workerRoutes ttsClients --> workerRoutes transcriptionFactory --> workerRoutes chatProviders --> openAI transcriptionFactory --> openAI workerRoutes --> anthropic workerRoutes --> assemblyAI workerRoutes --> elevenLabs ``` ## Push-to-Talk Request Flow Editable Excalidraw source:"
                - button "push-to-talk-flow.excalidraw" [ref=e431]
                - text: "```mermaid sequenceDiagram participant User participant Shortcut as Shortcut Monitor participant Manager as CompanionManager participant Dictation as BuddyDictationManager participant STT as Transcription Provider participant Capture as ScreenCaptureUtility participant Chat as Chat Provider participant Grounding as GroundingCoordinator participant Overlay as OverlayWindow participant TTS as Speech Output User->>Shortcut: Hold ctrl + option Shortcut->>Manager: Start listening Manager->>Dictation: Begin dictation session Dictation->>STT: Stream or buffer microphone audio User->>Shortcut: Release ctrl + option Shortcut->>Manager: Stop listening Dictation->>Manager: Final transcript Manager->>Capture: Capture active displays Capture->>Manager: Screenshots Manager->>Chat: Transcript + screenshots + history Chat->>Manager: Assistant response Manager->>Grounding: Resolve UI target from response Grounding->>Manager: Point target or no target par Visual guidance Manager->>Overlay: Show response bubble and cursor and Spoken guidance Manager->>TTS: Speak assistant response end ``` ## Provider Routing The repo currently supports two runtime modes: - Worker-backed mode: - Claude chat goes through `/chat` - ElevenLabs speech goes through `/tts` - AssemblyAI streaming gets a temporary token from `/transcribe-token` - Local OpenAI-first mode: - chat can call OpenAI directly from the app - transcription can call OpenAI directly from the app - grounding can use OpenAI computer use directly from the app - speech falls back to macOS system TTS when the worker-backed ElevenLabs path is unavailable ## Component Ownership - `CompanionManager` is the main orchestrator and state machine. - `BuddyDictationManager` owns the microphone and transcription lifecycle. - `GroundingCoordinator` decides how UI targets are resolved. - `OverlayWindow` renders the on-screen cursor, response bubble, waveform, and pointing animation. - `MenuBarPanelManager` and `CompanionPanelView` own the menu bar UI. - `worker/src/index.ts` is only a proxy layer, not the core application logic."
