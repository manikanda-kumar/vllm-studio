# CRITICAL
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Compile
        run: python -m compileall -q controller
      - name: Lint
        run: ruff check controller

  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: ./controller
        run: bun install
      - name: Type check
        working-directory: ./controller
        run: bun run typecheck
      - name: Lint
        working-directory: ./controller
        run: bun run lint
      - name: Dead code detection
        working-directory: ./controller
        run: bunx knip
      - name: Duplicate code detection
        working-directory: ./controller
        run: bunx jscpd src
      - name: Unused dependencies
        working-directory: ./controller
        run: bunx depcheck --ignores=lint-staged,pg,swagger-ui-dist,@hono/zod-openapi,bun:sqlite,bun:test,@npmcli/config,@types/pg,@types/bun-types,@types/bun,prettier
      - name: Test
        working-directory: ./controller
        run: bun test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: ./cli
        run: bun install
      - name: Type check
        working-directory: ./cli
        run: bun run typecheck
      - name: Lint
        working-directory: ./cli
        run: bun run lint
      - name: Dead code detection
        working-directory: ./cli
        run: bunx knip
      - name: Duplicate code detection
        working-directory: ./cli
        run: bunx jscpd src
      - name: Unused dependencies
        working-directory: ./cli
        run: bunx depcheck --ignores=lint-staged,prettier,husky,@types/bun,bun-types,@types/bun-types
      - name: Test
        working-directory: ./cli
        run: bun test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Type check
        working-directory: ./frontend
        run: npm run lint
      - name: Dead code detection
        working-directory: ./frontend
        run: npx knip
      - name: Duplicate code detection
        working-directory: ./frontend
        run: npx jscpd src
      - name: Unused dependencies
        working-directory: ./frontend
        run: npx depcheck --ignores=@types/react,@types/react-dom,@types/node,@types/react-syntax-highlighter,eslint-config-next,tailwindcss,@tailwindcss/postcss,prettier,@ai-sdk/openai,@ai-sdk/openai-compatible,@ai-sdk/react,ai,rehype-highlight,zod,lint-staged,husky,jscpd,depcheck,knip
      - name: Test
        working-directory: ./frontend
        run: npm test

  e2e-browser:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: ./frontend
        run: npm run build
      - name: Run browser e2e
        working-directory: ./frontend
        run: npm run test:e2e -- --project=browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-browser
          path: frontend/test-artifacts/

  e2e-electron:
    runs-on: ${{ matrix.os }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build desktop
        working-directory: ./frontend
        run: npm run desktop:build
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps
      - name: Electron e2e (Linux)
        if: runner.os == 'Linux'
        working-directory: ./frontend
        run: xvfb-run --auto-servernum npm run test:e2e:electron
      - name: Electron e2e (macOS)
        if: runner.os == 'macOS'
        working-directory: ./frontend
        run: npm run test:e2e:electron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-electron-${{ matrix.os }}
          path: frontend/test-artifacts/

  smoke:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build
        working-directory: ./frontend
        run: npm run build
      - name: Start dev server and run smoke
        working-directory: ./frontend
        run: |
          PORT=3210 npm run start &
          PID=$!
          sleep 8
          npm run smoke
          EXIT=$?
          kill $PID || true
          exit $EXIT
